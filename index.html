<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Transit Tools // WMATA</title>
<style>
  :root {
    --bg: #f5f6f3;
    --panel: #ffffff;
    --accent: #0a4fa8;
    --warm: #c85a10;
    --text-dim: #6b7069;
    --text-mid: #23261f;
    --line: #dcdfd7;
    --mono: 'SF Mono', 'IBM Plex Mono', 'Courier New', monospace;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text-mid);
    font-family: var(--sans);
    height: 100%;
  }

  .wrap {
    max-width: 480px;
    margin: 0 auto;
    padding: 40px 20px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header {
    margin-bottom: 32px;
  }

  header h1 {
    font-family: var(--mono);
    font-size: 15px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--accent);
    margin: 0 0 6px;
  }

  header p {
    font-size: 12px;
    color: var(--text-dim);
    margin: 0;
  }

  .cards {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  a.card {
    display: block;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 20px;
    text-decoration: none;
    color: inherit;
    box-shadow: 0 1px 2px rgba(0,0,0,0.04);
    transition: transform 0.1s ease, box-shadow 0.1s ease;
  }

  a.card:active {
    transform: translateY(1px);
  }

  .card .eyebrow {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--warm);
    margin-bottom: 6px;
  }

  .card h2 {
    font-size: 17px;
    margin: 0 0 6px;
    color: var(--text-mid);
  }

  .card p {
    font-size: 13px;
    color: var(--text-dim);
    margin: 0;
    line-height: 1.5;
  }

  .card .arrow {
    float: right;
    font-family: var(--mono);
    color: var(--accent);
    font-size: 16px;
  }

  footer {
    margin-top: auto;
    padding-top: 30px;
    text-align: center;
    font-size: 10px;
    color: var(--text-dim);
    font-family: var(--mono);
    letter-spacing: 0.05em;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Transit Tools <span style="color:var(--text-dim);font-weight:normal;">// WMATA</span></h1>
    <p>Prototype apps built on WMATA's public API.</p>
  </header>

  <div class="cards">
    <a class="card" href="bus-tracker.html">
      <span class="arrow">→</span>
      <div class="eyebrow">Arrival board</div>
      <h2>Next Bus</h2>
      <p>Live next-arrival predictions for your saved stops, sorted by soonest.</p>
    </a>

    <a class="card" href="bus-locator.html">
      <span class="arrow">→</span>
      <div class="eyebrow">Live map</div>
      <h2>Bus Locator</h2>
      <p>See exactly where buses on a route are right now, relative to your location.</p>
    </a>
  </div>

  <footer>data via api.wmata.com</footer>
</div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Next Bus // WMATA</title>
<style>
  :root {
    --bg: #0a0b0a;
    --panel: #131513;
    --panel-raised: #1b1d1b;
    --amber: #ffb020;
    --amber-dim: #7a5210;
    --amber-glow: rgba(255, 176, 32, 0.35);
    --text-dim: #8a8d87;
    --text-mid: #c4c7c0;
    --line: #262822;
    --danger: #ff5a4d;
    --mono: 'SF Mono', 'IBM Plex Mono', 'Courier New', monospace;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text-mid);
    font-family: var(--sans);
    min-height: 100vh;
  }

  body {
    background-image:
      repeating-linear-gradient(0deg, rgba(255,255,255,0.012) 0px, rgba(255,255,255,0.012) 1px, transparent 1px, transparent 3px);
  }

  .wrap {
    max-width: 720px;
    margin: 0 auto;
    padding: 20px 16px 80px;
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--line);
  }

  header h1 {
    font-family: var(--mono);
    font-size: 14px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--amber);
    margin: 0;
    text-shadow: 0 0 12px var(--amber-glow);
  }

  header h1 span {
    color: var(--text-dim);
    text-shadow: none;
    font-weight: normal;
  }

  .header-right {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  #clock {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text-dim);
    letter-spacing: 0.05em;
  }

  #gear {
    background: none;
    border: none;
    color: var(--text-dim);
    font-size: 16px;
    padding: 2px 4px;
    cursor: pointer;
    line-height: 1;
  }
  #gear:hover { color: var(--amber); background: none; }

  /* Setup panel */
  #setup {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 3px;
    padding: 16px;
    margin-bottom: 18px;
  }

  #setup.collapsed .setup-body { display: none; }

  .setup-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    cursor: pointer;
  }

  .setup-head h2 {
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin: 0;
    font-weight: 600;
  }

  .setup-head .toggle {
    font-family: var(--mono);
    color: var(--amber-dim);
    font-size: 13px;
  }

  .setup-body { margin-top: 14px; }

  label {
    display: block;
    font-size: 11px;
    color: var(--text-dim);
    letter-spacing: 0.04em;
    margin-bottom: 5px;
  }

  input[type="text"], input[type="password"] {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--line);
    color: var(--text-mid);
    font-family: var(--mono);
    font-size: 13px;
    padding: 9px 10px;
    border-radius: 2px;
    outline: none;
  }

  input[type="text"]:focus, input[type="password"]:focus {
    border-color: var(--amber-dim);
  }

  .field { margin-bottom: 12px; }

  .remember-row {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    color: var(--text-dim);
    margin-bottom: 12px;
  }
  .remember-row input { width: auto; }

  .stop-add-row {
    display: flex;
    gap: 8px;
    align-items: flex-end;
  }

  .stop-add-row .field { flex: 1; margin-bottom: 0; }

  button {
    font-family: var(--sans);
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.03em;
    border: 1px solid var(--amber-dim);
    background: transparent;
    color: var(--amber);
    padding: 9px 14px;
    border-radius: 2px;
    cursor: pointer;
  }

  button:hover { background: rgba(255,176,32,0.08); }
  button:active { transform: translateY(1px); }

  button.ghost {
    border-color: var(--line);
    color: var(--text-dim);
  }

  .stop-list {
    margin-top: 14px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .stop-chip {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: var(--panel-raised);
    border: 1px solid var(--line);
    padding: 7px 10px;
    border-radius: 2px;
    font-family: var(--mono);
    font-size: 12px;
  }

  .stop-chip button {
    border: none;
    color: var(--danger);
    font-size: 14px;
    padding: 0 4px;
    background: none;
  }

  /* Board */
  #board { display: flex; flex-direction: column; gap: 14px; }

  .stop-card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 3px;
    overflow: hidden;
  }

  .stop-card-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 11px 14px;
    background: var(--panel-raised);
    border-bottom: 1px solid var(--line);
  }

  .stop-card-head h3 {
    margin: 0;
    font-size: 13px;
    letter-spacing: 0.04em;
    color: var(--text-mid);
  }

  .stop-card-head .stop-id {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--text-dim);
  }

  .status-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #3fa84e;
    box-shadow: 0 0 6px #3fa84e;
    display: inline-block;
    margin-right: 6px;
  }

  .status-dot.err { background: var(--danger); box-shadow: 0 0 6px var(--danger); }

  .predictions { padding: 6px 0; }

  .pred-row {
    display: grid;
    grid-template-columns: 52px 1fr auto;
    gap: 10px;
    align-items: center;
    padding: 10px 14px;
    border-bottom: 1px solid rgba(255,255,255,0.03);
  }

  .pred-row:last-child { border-bottom: none; }

  .route-badge {
    font-family: var(--mono);
    font-size: 13px;
    font-weight: 700;
    color: var(--bg);
    background: var(--text-mid);
    text-align: center;
    padding: 4px 0;
    border-radius: 2px;
  }

  .dest {
    font-size: 13px;
    color: var(--text-mid);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .dest .veh {
    display: block;
    font-size: 10px;
    color: var(--text-dim);
    font-family: var(--mono);
    margin-top: 2px;
  }

  .eta {
    font-family: var(--mono);
    font-size: 26px;
    font-weight: 700;
    color: var(--amber);
    text-shadow: 0 0 10px var(--amber-glow);
    text-align: right;
    min-width: 64px;
  }

  .eta small {
    font-size: 10px;
    font-weight: 400;
    color: var(--amber-dim);
    margin-left: 3px;
    text-shadow: none;
  }

  .eta.due { color: #ff6b3d; text-shadow: 0 0 10px rgba(255,107,61,0.4); }

  .empty-row, .error-row {
    padding: 18px 14px;
    font-size: 12px;
    color: var(--text-dim);
    font-family: var(--mono);
  }

  .error-row { color: var(--danger); }
  .error-row a { color: var(--danger); }

  #empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-dim);
    font-size: 13px;
    line-height: 1.6;
  }

  #empty-state .big {
    font-family: var(--mono);
    color: var(--amber-dim);
    font-size: 28px;
    display: block;
    margin-bottom: 10px;
    letter-spacing: 0.1em;
  }

  footer {
    text-align: center;
    margin-top: 24px;
    font-size: 10px;
    color: var(--text-dim);
    font-family: var(--mono);
    letter-spacing: 0.05em;
  }

  @media (max-width: 420px) {
    .pred-row { grid-template-columns: 42px 1fr auto; padding: 9px 12px; }
    .route-badge { font-size: 11px; }
    .eta { font-size: 18px; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>NEXT BUS <span>// WMATA</span></h1>
    <div class="header-right">
      <div id="clock">--:--:--</div>
      <button id="gear" onclick="toggleSetup()" title="Edit stops">⚙</button>
    </div>
  </header>

  <div id="setup">
    <div class="setup-head">
      <h2>Stops</h2>
    </div>
    <div class="setup-body">
      <div class="field">
        <label for="apiKey">WMATA API Key</label>
        <input type="password" id="apiKey" placeholder="paste your key here" autocomplete="off">
      </div>
      <div class="remember-row">
        <input type="checkbox" id="rememberKey">
        <label for="rememberKey" style="margin:0;">Remember API key on this device</label>
      </div>

      <div class="stop-add-row">
        <div class="field">
          <label for="stopId">Stop ID</label>
          <input type="text" id="stopId" placeholder="e.g. 1001195" autocomplete="off" inputmode="numeric">
        </div>
        <div class="field">
          <label for="stopLabel">Label (optional)</label>
          <input type="text" id="stopLabel" placeholder="e.g. Home stop" autocomplete="off">
        </div>
        <button onclick="addStop()">Add</button>
      </div>

      <div class="stop-list" id="stopList"></div>
    </div>
  </div>

  <div id="board"></div>

  <div id="empty-state">
    <span class="big">&gt;_</span>
    Enter your API key and at least one stop ID above to start tracking arrivals.<br>
    Find stop IDs at developer.wmata.com or via the Stops endpoint.
  </div>

  <footer>refreshes every 25s · data via api.wmata.com</footer>
</div>

<script>
let stops = [];       // { id, label }
let apiKey = '';
let refreshTimer = null;
const REFRESH_MS = 25000;
const KEY_STORAGE = 'wmata_api_key';

// Restore saved key on load (only works when this file is opened directly
// in a browser tab -- a Claude.ai inline preview sandbox blocks localStorage)
try {
  const saved = localStorage.getItem(KEY_STORAGE);
  if (saved) {
    document.getElementById('apiKey').value = saved;
    document.getElementById('rememberKey').checked = true;
    apiKey = saved;
  }
} catch (e) { /* storage unavailable in this context, ignore */ }

document.getElementById('rememberKey').addEventListener('change', saveKeyIfRemembered);

function saveKeyIfRemembered() {
  try {
    if (document.getElementById('rememberKey').checked) {
      localStorage.setItem(KEY_STORAGE, document.getElementById('apiKey').value.trim());
    } else {
      localStorage.removeItem(KEY_STORAGE);
    }
  } catch (e) { /* storage unavailable, ignore silently */ }
}

function toggleSetup() {
  const el = document.getElementById('setup');
  el.classList.toggle('collapsed');
  document.getElementById('setup-toggle').textContent = el.classList.contains('collapsed') ? '▸' : '▾';
}

function addStop() {
  const idInput = document.getElementById('stopId');
  const labelInput = document.getElementById('stopLabel');
  const id = idInput.value.trim();
  if (!id) { idInput.focus(); return; }
  const label = labelInput.value.trim() || ('Stop ' + id);
  stops.push({ id, label });
  idInput.value = '';
  labelInput.value = '';
  renderStopList();
  renderBoard();
  restartPolling();

  // Get out of the way once there's something to show
  document.getElementById('setup').classList.add('collapsed');
}

function removeStop(index) {
  stops.splice(index, 1);
  renderStopList();
  renderBoard();
  restartPolling();
}

function renderStopList() {
  const container = document.getElementById('stopList');
  container.innerHTML = '';
  stops.forEach((s, i) => {
    const chip = document.createElement('div');
    chip.className = 'stop-chip';
    chip.innerHTML = `<span>${escapeHtml(s.label)} <span style="color:var(--text-dim)">#${escapeHtml(s.id)}</span></span>`;
    const btn = document.createElement('button');
    btn.textContent = '✕';
    btn.onclick = () => removeStop(i);
    chip.appendChild(btn);
    container.appendChild(chip);
  });
}

function escapeHtml(str) {
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

function renderBoard() {
  const board = document.getElementById('board');
  const empty = document.getElementById('empty-state');
  board.innerHTML = '';

  if (stops.length === 0) {
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';

  stops.forEach((s, i) => {
    const card = document.createElement('div');
    card.className = 'stop-card';
    card.id = 'stop-card-' + i;
    card.innerHTML = `
      <div class="stop-card-head">
        <h3><span class="status-dot" id="dot-${i}"></span>${escapeHtml(s.label)}</h3>
        <span class="stop-id" id="updated-${i}">#${escapeHtml(s.id)}</span>
      </div>
      <div class="predictions" id="pred-${i}">
        <div class="empty-row">waiting for data…</div>
      </div>
    `;
    board.appendChild(card);
  });
}

async function fetchStop(stop, index) {
  const dot = document.getElementById('dot-' + index);
  const predEl = document.getElementById('pred-' + index);
  if (!predEl) return;

  const url = `https://api.wmata.com/NextBusService.svc/json/jPredictions?StopID=${encodeURIComponent(stop.id)}`;

  try {
    const res = await fetch(url, {
      headers: { 'api_key': apiKey }
    });

    if (!res.ok) {
      let msg = `HTTP ${res.status}`;
      if (res.status === 403) msg = 'Invalid or missing API key (403)';
      if (res.status === 404) msg = 'Stop not found (404)';
      throw new Error(msg);
    }

    const data = await res.json();
    const preds = (data.Predictions || []).slice().sort((a, b) => {
      const av = a.Minutes === '' ? 999 : Number(a.Minutes);
      const bv = b.Minutes === '' ? 999 : Number(b.Minutes);
      return av - bv;
    });

    if (dot) dot.classList.remove('err');

    if (preds.length === 0) {
      predEl.innerHTML = '<div class="empty-row">no buses currently predicted</div>';
      return;
    }

    predEl.innerHTML = preds.map(p => {
      const mins = p.Minutes === '' || p.Minutes === undefined ? '—' : p.Minutes;
      const isDue = mins === 0 || mins === '0';
      return `
        <div class="pred-row">
          <div class="route-badge">${escapeHtml(p.RouteID || '?')}</div>
          <div class="dest">${escapeHtml(p.DirectionText || 'Unknown direction')}</div>
          <div class="eta ${isDue ? 'due' : ''}">${isDue ? 'DUE' : mins}${isDue ? '' : '<small>min</small>'}</div>
        </div>
      `;
    }).join('');

    const updatedEl = document.getElementById('updated-' + index);
    if (updatedEl) updatedEl.textContent = 'updated ' + new Date().toLocaleTimeString('en-US', { hour12: false });

  } catch (err) {
    if (dot) dot.classList.add('err');
    let hint = '';
    if (err.message && err.message.includes('Failed to fetch')) {
      hint = 'Network/CORS error — WMATA may be blocking this request from the browser, or you\'re offline.';
    }
    predEl.innerHTML = `<div class="error-row">⚠ ${escapeHtml(err.message)}${hint ? '<br>' + hint : ''}</div>`;
  }
}

function pollAll() {
  if (!apiKey || stops.length === 0) return;
  stops.forEach((s, i) => fetchStop(s, i));
}

function restartPolling() {
  if (refreshTimer) clearInterval(refreshTimer);
  pollAll();
  refreshTimer = setInterval(pollAll, REFRESH_MS);
}

document.getElementById('apiKey').addEventListener('input', (e) => {
  apiKey = e.target.value.trim();
  saveKeyIfRemembered();
  restartPolling();
});

document.getElementById('stopId').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') addStop();
});

function tickClock() {
  const now = new Date();
  document.getElementById('clock').textContent = now.toLocaleTimeString('en-US', { hour12: false });
}
setInterval(tickClock, 1000);
tickClock();

renderBoard();
</script>
</body>
</html>
